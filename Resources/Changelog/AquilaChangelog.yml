Name: Aquila
Order: -2
Entries:
- author: CrookLv
  changes:
    - type: Add
      message: В списке изменений появилась вкладка Aquila, здесь будут все изменения нашего сервера.
    - type: Tweak
      message: Синтетические органы, станционные аугменты и подкожные импланты дают меньше кибернагрузки, а импланты-переводчики не дают её совсем. Полностью кибернизированный станционным железом человек остаётся в зоне, где киберпсихоз ещё лечится.
    - type: Fix
      message: Операции больше не застревают на шаге зашивания, если в части тела несколько однотипных органов или аугментов, например два аугмента в одной руке.
  id: 1
  time: '2026-11-03T06:47:42.0000000+00:00'
- author: CrookLv
  changes:
    - type: Fix
      message: Новые автоматы с клавиатурой снова работают с экономикой. Они показывают цены, продают товары за кредиты без доступа к автомату и не продают служебные товары тем, кому они не положены.
  id: 2
  time: '2026-11-03T07:18:19.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: Помехи киберпсихоза плавно сходят на нет к центру экрана, без чёткого круга, а на стадии срыва экран краснее.
    - type: Tweak
      message: На стадии срыва киберпсих чаще теряет контроль над телом и дольше остаётся в ярости.
  id: 3
  time: '2026-11-03T07:33:31.0000000+00:00'
- author: CrookLv
  changes:
    - type: Add
      message: На стадии срыва киберпсих видит в людях ещё и ревенантов, ниндзя, волшебников и зомби.
    - type: Fix
      message: Во время приступа ярости киберпсих видит и слышит свои удары, а жертвы вспыхивают красным, как при обычной драке.
    - type: Fix
      message: Враждебные облики, которые видит киберпсих, падают и поворачиваются вместе с людьми, а с мёртвых облик спадает.
  id: 4
  time: '2026-11-03T08:05:17.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: Лёжа с занятыми руками можно ползти, просто медленнее, до половины обычной скорости ползания, а не стоять на месте.
    - type: Fix
      message: Когда киберпсих в приступе ярости стреляет, он видит свои пули и вспышки выстрелов и слышит выстрелы.
  id: 5
  time: '2026-11-03T08:24:19.0000000+00:00'
- author: CrookLv
  changes:
    - type: Add
      message: Вместо отдельных имплантов-переводчиков в лейтах теперь печатаются языковые чипы и один языковой имплант. Чипы вставляются в имплант, если использовать чип на себе или на другом человеке, и вынимаются через контекстное меню на себе. Кибернагрузку даёт только имплант, чипы её не дают.
  id: 6
  time: '2026-11-03T10:31:56.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: Энграммы говорят и понимают только на тех языках, которые знала жертва, и по умолчанию говорят на её последнем языке.
    - type: Tweak
      message: Слот-машина при нехватке денег пишет, сколько стоит вращение и сколько кредитов в ней лежит.
    - type: Fix
      message: После лечения киберпсихоза или выхода в призраки люди больше не остаются красными, полупрозрачными или в чужом облике.
    - type: Fix
      message: После клонирования сохраняется выбранный голос (барк), а не ставится стандартный.
  id: 7
  time: '2026-11-04T09:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Add
      message: Гражданский сандевистан в исследовании "Продвинутая кибернетика". Ускоряет только бег и слабее синдикатного, не оставляет следа, не меняет восприятие мира и отключается предохранителем раньше, чем тело начнёт получать урон.
    - type: Add
      message: Операция "Извлечение клинка богомола" на руке. Клинок больше не нужно отрезать вместе с рукой, а сканер имплантов показывает, в какой руке он стоит.
    - type: Fix
      message: У каждого человека с раздвоением личности теперь свой внутренний голос, чужие его не слышат.
  id: 8
  time: '2026-11-04T10:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Add
      message: 'Порядок действий на панели запоминается между раундами: перетащенные действия в следующих раундах встают на те же места, а вернувшиеся действия занимают своё прежнее место среди соседей.'
  id: 9
  time: '2026-11-04T12:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Add
      message: В окне рингтона КПК появился беззвучный режим. С ним уведомления только вибрируют, а мелодия не играет. Кнопка "Тест" по-прежнему проигрывает рингтон.
  id: 10
  time: '2026-11-04T13:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: Кибернетические руки, кисти, ноги и ступни получили новые спрайты.
  id: 11
  time: '2026-11-04T14:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Fix
      message: 'Операции "Восстановление костей" и "Лечение органов" больше не пропадают из списка, если часть тела кровоточит: теперь они начинаются с зажима кровоточащих сосудов. Так можно срастить сломанную грудную клетку и подлечить повреждённое сердце или сандевистан.'
  id: 12
  time: '2026-11-04T15:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: 'Сандевистан и клинки богомола хирург находит только после того, как их опознает сканер имплантов: без этого операций "Удаление сердца" и "Извлечение клинка богомола" для них нет. Синдикатские сандевистаны и клинки опознаёт только глубокий скан, и то не наверняка, а гражданский сандевистан виден любому скану. Владелец, который оперирует сам себя, обходится без скана.'
  id: 13
  time: '2026-11-04T16:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: 'Нейроадаптин из ингалятора Синдиката теперь ещё и помогает при киберпсихозе: пока он в крови, приступы, глитчи и враждебные облики пропадают, а до трёх минут после того, как он выведется, шанс, что киберпсихоз начнётся или станет тяжелее, вдвое ниже.'
  id: 14
  time: '2026-11-04T17:00:00.0000000+00:00'
- author: CrookLv
  changes:
    - type: Tweak
      message: Вернули старые спрайты луж.
    - type: Tweak
      message: Вернули старые облачка речи, новые можно включить в настройках.
    - type: Remove
      message: Убрали показ предмета над головой при взаимодействии.
  id: 15
  time: '2026-11-04T18:00:00.0000000+00:00'
- author: CrookLv
  changes:
