# Пресет Aquila. Грузится после Corvax/common и перекрывает его значения:
# [config] presets = "Corvax/common,_Aquila/main"
# Всё, что зависит от конкретной машины (IP, пароли, токены), сюда не кладётся, это живёт в config.toml на хосте.

[infolinks]
# Пустая ссылка прячет кнопку в лаунчере и лобби. Впиши свои, когда появятся.
discord = ""
github = ""
wiki = ""
patreon = ""
appeal = ""
bug_report = ""
website = ""

[whitelist]
# Пускает только тех, кто есть в вайтлисте в базе. Добавлять игроков: команда whitelistadd <ник> в админ-консоли.
enabled = true

[hub]
advertise = true
tags = "lang:ru,region:eu_w"
