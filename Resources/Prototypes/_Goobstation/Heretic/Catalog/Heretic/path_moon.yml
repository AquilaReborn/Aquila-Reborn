# Aquila Change

- type: listing
  id: HereticMoonPath1
  name: knowledge-path-moon-s1-name
  description: knowledge-path-moon-s1-desc
  icon: { sprite: _Aquila/Heretic/Moon/Blades/blade_moon.rsi, state: icon }
  raiseProductEventOnMind: true
  productEvent: !type:EventHereticAddKnowledge
    knowledge:
    - MoonlightTroupe
  cost:
    KnowledgePoint: 1
  categories:
  - HereticPathMoon
  conditions:
  - !type:ListingLimitedStockCondition
    stock: 1
  - !type:HereticPathCondition
    stage: 0
    # add every path here because you shouldn't be able to buy more starter knowledge
    blacklist:
    - Ash
    - Blade
    - Flesh
    - Lock
    - Void
    - Rust
    - Cosmos
    - Moon

