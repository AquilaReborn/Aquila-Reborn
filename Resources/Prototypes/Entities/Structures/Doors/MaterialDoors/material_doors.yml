- type: entity # Aquila Change
  abstract: true
  parent: BaseStructure
  id: BaseMaterialDoor
  name: door
  description: A door, where will it lead?
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Doors/MaterialDoors/silver-door.rsi # Aquila Change
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
    openSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
    closeSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
  - type: Appearance
  - type: Airtight
  - type: RCDDeconstructable
    cost: 6
    delay: 6
    fx: EffectRCDDeconstruct6
  - type: Occluder
  - type: BlockWeather
  # Aquila Change start
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: PlacementReplacement
    key: walls
  # Aquila Change end

- type: entity
  abstract: true
  parent: BaseMaterialDoor
  id: BaseMaterialDoorNavMap
  components:
  - type: NavMapDoor

### Metal doors ###
- type: entity
  # Aquila Change start
  parent:
  - BaseMaterialDoorNavMap
  - StructureHealthDoorWeak
  # Aquila Change end
  id: PlasmaDoor
  name: plasma door
  components:
  - type: Sprite
    sprite: Structures/Doors/MaterialDoors/plasma-door.rsi # Aquila Change
  - type: Construction
    graph: DoorGraph
    node: plasmaDoor
  # Aquila Change start
  - type: Damageable
    damageModifierSet: PlasmaMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    # Aquila Change start
    - trigger:
        !type:DamageTrigger
        damage: 100
    # Aquila Change end
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasma1:
            min: 3
            max: 5

