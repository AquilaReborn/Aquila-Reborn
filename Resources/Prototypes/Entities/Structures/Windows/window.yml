- type: entity
  abstract: true # Aquila Change
  parent: [BaseDeltaPressureGlass, BaseStructure]
  id: BaseWindowStructure # Aquila Change
  name: window
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: WallMount
    arc: 360 # interact despite grilles
  - type: Tag
    tags:
    # Aquila Change start
    - ForceFixRotations
    - Window
    # Aquila Change end
  - type: Sprite
    sprite: Structures/Windows/window-base.rsi # Aquila Change
  - type: Icon
    sprite: Structures/Windows/window-base.rsi # Aquila Change
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: RCDDeconstructable
    cost: 6
    delay: 4
    fx: EffectRCDDeconstruct4
  - type: Airtight
  - type: IconSmooth
    key: walls
    base: window
  # Aquila Change start
  - type: PlacementReplacement
    key: walls
  # Aquila Change end
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Construction
    graph: Window
    node: window
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 100
  - type: BlockWeather

# Aquila Change start
- type: entity
  parent: [ BaseWindowStructure, StructureHealthBarrier ]
  id: Window
  components:
  - type: Sprite
    sprite: Structures/Windows/window-base.rsi
  - type: Icon
    sprite: Structures/Windows/window-base.rsi
    state: full
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger: &DamageBarrierNormal
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]
# Aquila Change end

- type: entity
  parent: Window
  id: TintedWindow
  name: tinted window
  components:
  - type: Sprite
    sprite: Structures/Windows/window-tinted.rsi # Aquila Change
  - type: Icon
    sprite: Structures/Windows/window-tinted.rsi # Aquila Change
  - type: IconSmooth
    base: twindow
  - type: Construction
    graph: Window
    node: tintedWindow
  - type: Occluder
  - type: StaticPrice
    price: 70

# Aquila Change start
- type: entity # Goob
  parent: TintedWindow
  id: TintedWindowTransparent
  suffix: Transparent
  components:
  - type: Occluder
    enabled: false
# Aquila Change end

- type: entity
  abstract: true
  id: BaseRCDResistant # Aquila Change
  components:
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  # Aquila Change start
  abstract: true
  parent: [Window, BaseRCDResistant]
  id: WindowRCDResistant

- type: entity
  abstract: true
  # Aquila Change end
  parent: [BaseDeltaPressureGlassQuarter, BaseStructure]
  id: BaseWindowStructureDirectional # Aquila Change
  name: directional window
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: WallMount
    arc: 360 # interact despite grilles
  - type: Tag
    tags:
    - Window # Aquila Change
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Sprite
    drawdepth: Mobs
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.28125"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Repairable
  - type: ExaminableDamage
    messages: WindowMessages
  - type: RCDDeconstructable
    cost: 4
    delay: 2
    fx: EffectRCDDeconstruct2
  # Aquila Change start
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: StaticPrice
    price: 15
  - type: Construction
    graph: WindowDirectional
    node: windowDirectional

- type: entity
  parent: [ BaseWindowStructureDirectional, StructureHealthBarrierWeak ]
  id: WindowDirectional
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: window
  - type: Damageable
    damageModifierSet: GlassMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      # Aquila Change start
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]

