- type: entity
  id: PlastitaniumWindowBase
  parent: BaseStructure
  abstract: true
  name: plastitanium window
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: RCDDeconstructable
    deconstructable: false
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: WallMount
    arc: 360 # interact despite grilles
  - type: Tag
    tags:
      - ForceFixRotations
      - Window
  - type: Physics
    bodyType: Static
  - type: ExaminableDamage
    messages: WindowMessages
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Appearance
  - type: StaticPrice
    price: 100
  - type: BlockWeather
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000
  # Aquila Change start
  - type: PlacementReplacement
    key: walls
  # Aquila Change end

- type: entity
  id: PlastitaniumWindowSquareBase
  abstract: true
  name: plastitanium window
  parent: PlastitaniumWindowBase
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-plastitanium.rsi # Aquila Change
  - type: Icon
    sprite: Structures/Windows/window-plastitanium.rsi # Aquila Change
    state: full
  - type: IconSmooth
    key: walls # Aquila Change
    base: ptwindow
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer

- type: entity
  id: PlastitaniumWindowIndestructible
  name: plastitanium window
  parent: PlastitaniumWindowSquareBase
  suffix: indestructible
  components:
  - type: ExaminableDamage
    messages: null

- type: entity
  parent: [ PlastitaniumWindowSquareBase, StructureHealthBarrierStrong ] # Aquila Change
  id: PlastitaniumWindow
  name: plastitanium window
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      # Aquila Change start
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]
      # Aquila Change end
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageModifierSet: PlastitaniumMod # Aquila Change

- type: entity
  id: PlastitaniumWindowDiagonalBase
  abstract: true
  name: plastitanium window
  parent: PlastitaniumWindowBase
  suffix: diagonal
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-plastitanium.rsi # Aquila Change
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: Icon
    sprite: Structures/Windows/window-diagonal-plastitanium.rsi # Aquila Change
    state: state0
  - type: IconSmooth
    mode: Diagonal
    key: walls # Aquila Change
    base: state
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
        density: 4000
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East

- type: entity
  id: PlastitaniumWindowDiagonalIndestructible
  name: plastitanium window
  parent: PlastitaniumWindowDiagonalBase
  suffix: diagonal, indestructible
  components:
  - type: ExaminableDamage
    messages: null

- type: entity
  id: PlastitaniumWindowDiagonal
  name: plastitanium window
  parent: [ PlastitaniumWindowDiagonalBase, StructureHealthBarrierStrong ] # Aquila Change
  suffix: diagonal
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      # Aquila Change start
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]
      # Aquila Change end
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi # Aquila Change
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageModifierSet: PlastitaniumMod # Aquila Change
