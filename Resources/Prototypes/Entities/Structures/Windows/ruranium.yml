- type: entity
  parent: [BaseDeltaPressureReinforcedPlasma, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrierStrong] # Aquila Change
  id: ReinforcedUraniumWindow
  name: reinforced uranium window
  components:
  - type: Sprite
    sprite: Structures/Windows/window-uranium-reinf.rsi # Aquila Change
  - type: Icon
    # Aquila Change start
    sprite: Structures/Windows/window-uranium-reinf.rsi
    state: full
    # Aquila Change end
  - type: Damageable
    damageModifierSet: GlassReinforcedMod # Aquila Change
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      # Aquila Change start
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]
      # Aquila Change end
  - type: IconSmooth
    base: ruwindow
  - type: Construction
    graph: Window
    node: reinforcedUraniumWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 6
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 215
  - type: RadiationBlocker
    resistance: 5 # Aquila Change

- type: entity
  parent: [BaseDeltaPressureReinforcedPlasmaQuarter, BaseWindowStructureDirectional, BaseRCDResistant, StructureHealthBarrier] # Aquila Change
  id: UraniumReinforcedWindowDirectional
  name: directional reinforced uranium window
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: uranium_reinforced_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: uranium_reinforced_window
  - type: Construction
    graph: WindowDirectional
    node: uraniumReinforcedWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Damageable
    damageModifierSet: GlassReinforcedMod # Aquila Change
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      # Aquila Change start
      - !type:DoActsBehavior # AQUILA FIXES
        acts: [ "Destruction" ]
      # Aquila Change end
  - type: StaticPrice
    price: 110
  - type: RadiationBlocker
    # Aquila Change start
    resistance: 2.5

- type: entity
  parent: UraniumReinforcedWindowDirectional
  id: UraniumReinforcedWindowDirectionalCorner
  suffix: Corner
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: uranium_reinforced_window_corner
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: uranium_reinforced_window_corner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.28125,-0.28125"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: WindowDirectionalCorner
    node: uraniumReinforcedWindowDirectionalCorner
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional_corner.rsi
    # Aquila Change end

- type: entity
  parent: ReinforcedUraniumWindow
  id: ReinforcedUraniumWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-uranium-reinf.rsi # Aquila Change
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: walls # Aquila Change
    base: state
  - type: Icon
    sprite: Structures/Windows/window-diagonal-uranium-reinf.rsi # Aquila Change
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi # Aquila Change
  - type: Construction
    graph: WindowDiagonal
    node: reinforcedUraniumWindowDiagonal
