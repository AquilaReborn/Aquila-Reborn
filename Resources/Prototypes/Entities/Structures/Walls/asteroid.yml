#TODO: Someone should probably move the ore vein prototypes into their own file, or otherwise split this up in some way. This should not be 1.5k lines long.
# I halved it, but we could still split the planet walls from the asteroid walls. Or prototype generation.

# Anyway
# See WallRock variants for the remappings.

- type: entity
  abstract: true # Aquila Change
  parent: BaseWall
  id: BaseAsteroidRock # Aquila Change
  components:
  - type: Transform
    noRot: true
  - type: IconSmooth
    # Aquila Change start
    key: stone
    additionalKeys:
    - doors
    base: stone
    # Aquila Change end
  - type: Icon
    state: full # Aquila Change
  - type: Sprite
    drawdepth: Walls # Aquila Change
  - type: MiningScannerViewable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

- type: entity
  abstract: true
  # Aquila Change start
  parent: StructureHealthBarrierWeak
  id: BaseAsteroidDestructible
  components:
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  # Aquila Change end

#region BaseVein

# Aquila Change start
- type: entity
  abstract: true
  parent: BaseStructureHealth
# Aquila Change end
  id: BaseRockGibtonite
  suffix: Gibtonite
  components:
  # Aquila Change start
  - type: Sprite
    layers:
    - state: gibtonite_inactive
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay", "gib" ]
  # Aquila Change end
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        "gib":
          Primed:
            state: gibtonite_active
            shader: unshaded
            visible: true
          Unprimed:
            state: gibtonite_inactive
            visible: false
  - type: TimerTrigger
    examinable: false
    beepInterval: 0.4
    beepSound:
      collection: GlassCrack
  - type: RandomTimerTrigger
    min: 8
    max: 10
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 450
    intensitySlope: 2.5
    maxIntensity: 10
    canCreateVacuum: false
  # Aquila Change start
  - type: Damageable
    damageModifierSet: RockMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3
      behaviors:
      - !type:TimerStartBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 500 # you have to really smack it for it to manually detonate. re-examine once defusal exists
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:TriggerBehavior
        keyOut: timer # explode immediately

