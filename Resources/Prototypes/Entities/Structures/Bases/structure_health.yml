# This file contains the standardized health values for structures.
# Minute health differences between similar entities does very little for actual gameplay,
# and by keeping consistent values durability can be better intuited and expected in relation to other entities.
# As a general guide: Furniture < Windows < Machines < Doors < Walls

# Aquila Change start
- type: entity
  abstract: true
  id: BaseStructureHealth
  components:
  - type: Destructible
  - type: Damageable
    damageContainer: StructuralInorganic
# Aquila Change end

#region Furniture

# Poster / faberge egg
# Aquila Change start
- type: entity
  abstract: true
  parent: BaseStructureHealth
  id: StructureHealthFurnitureWeak
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 5
      behaviors: &DoDestruction
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
# Aquila Change end

# General furniture like tables and chairs
# Aquila Change start
- type: entity
  abstract: true
  parent: BaseStructureHealth
  id: StructureHealthFurniture
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors: *DoDestruction
# Aquila Change end

# Landmark furniture like statues and trees
