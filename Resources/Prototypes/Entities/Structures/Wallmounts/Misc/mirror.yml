# Aquila Change start
- type: entity
  parent: [ BaseWallmountGlass, StructureHealthFurnitureWeak ]
# Aquila Change end
  id: Mirror
  name: mirror
  description: 'Mirror mirror on the wall , who''s the most robust of them all?'
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/mirror.rsi
    state: mirror
  # Aquila Change start
  - type: MagicMirror
    changeHairSound: null
    addSlotTime: 0
    removeSlotTime: 0
    selectSlotTime: 0
    changeSlotTime: 0
  # Aquila Change end
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  # Aquila Change start
  - type: Damageable
    damageModifierSet: GlassMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

- type: entity
  parent: Mirror
  id: MirrorModern
  suffix: rectangle
  components:
  - type: Sprite
    state: rectangle-mirror
