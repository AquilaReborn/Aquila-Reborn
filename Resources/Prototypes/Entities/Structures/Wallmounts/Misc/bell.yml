- type: entity
  parent: [ BaseWallmountMetallic, StructureHealthFurnitureStrong ] # Aquila Change
  id: BoxingBell
  name: boxing bell
  description: Ding ding!
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/bell.rsi
    layers:
    - state: bell
  - type: InteractionPopup
    successChance: 1
    interactSuccessSound:
      path: /Audio/Weapons/boxingbell.ogg
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/boxingbell.ogg"
  - type: Appearance
  # Aquila Change start
  - type: Damageable
    damageModifierSet: BrassMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          # Aquila Change start
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1:
            min: 1
            max: 2
          # Aquila Change end
