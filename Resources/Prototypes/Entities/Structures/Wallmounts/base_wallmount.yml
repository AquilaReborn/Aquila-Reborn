- type: entity
  id: BaseWallmount
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Physics
    canCollide: false
  - type: Fixtures # Aquila Change
  - type: Clickable
  - type: WallMount
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Tag
    tags:
    - Structure
  - type: Sprite
    drawdepth: WallMountedItems

- type: entity
  abstract: true # Aquila Change
  parent: BaseWallmount
  id: BaseWallmountGlass
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Damageable
    damageModifierSet: GlassMod # Aquila Change

- type: entity
  abstract: true # Aquila Change
  parent: BaseWallmount
  id: BaseWallmountMetallic
  components:
  # Aquila Change start
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalThud
  # Aquila Change end
  - type: Damageable
    damageModifierSet: SteelMod # Aquila Change

- type: entity
  parent: BaseWallmountMetallic
  id: BaseWallmountMachine
  abstract: true
  components:
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
