- type: entity
  abstract: true
  # Aquila Change start
  parent: BaseWallmount
  id: BaseSignIndestructible
  # Aquila Change end
  components:
  - type: WallMount
    arc: 360
  - type: Rotatable
  # Aquila Change start
  - type: Sprite
    sprite: Structures/Wallmounts/signs.rsi
    snapCardinals: true
  - type: StaticPrice
    price: 20
  # Aquila Change end
  # Hacky wacky - It inherit anchorable from "BaseWallmount", none of the BaseSign children are designed to be anchorable
  - type: Anchorable
    flags:
    - None

- type: entity
  abstract: true
  parent: [ BaseWallmountMetallic, BaseSignIndestructible, StructureHealthFurniture ]
  id: BaseSign
  name: base sign
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      # Aquila Change start
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      # Aquila Change end

- type: entity
  abstract: true
  parent: [ BaseSignIndestructible, StructureHealthFurnitureWeak ]
  id: BaseSignWeak
  components:
  - type: Damageable
    damageModifierSet: CardboardMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      # Aquila Change start
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      # Aquila Change end
