- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineWeak ] # Aquila Change
  id: Screen
  name: screen
  description: Displays text or time.
  components:
  - type: Rotatable
  - type: TextScreenVisuals
    # Aquila Change start
    textOffset: 0,-2
    timerOffset: 0,-8
    # Aquila Change end
    rows: 2
    # Aquila Change start
    rowLength: 6
    # Aquila Change end
  - type: Sprite
    noRot: true # Aquila Change
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/screen.rsi
    state: screen # Note: outer_frame will be added on top of text layers. # Aquila Change
  - type: Appearance
  # Aquila Change start
  - type: Damageable
    damageModifierSet: GlassMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Screen
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: ShuttleTimer

- type: entity
  id: ArrivalsShuttleTimer
  parent: Screen
  name: arrivals screen
  description: Displays time of arrivals shuttle ETA.
  components:
  - type: DeviceNetwork
    deviceNetId: Private
    receiveFrequencyId: ArrivalsShuttleTimer # Aquila Change
