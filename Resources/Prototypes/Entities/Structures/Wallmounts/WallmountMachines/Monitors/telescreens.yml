- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineWeak ] # Aquila Change
  id: WallmountTelescreen
  suffix: camera monitor
  name: telescreen
  description: Finally, some decent reception around here...
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
      - map: ["computerLayerBody"]
        state: telescreen_frame
      - map: ["computerLayerScreen"]
        state: telescreen
  # Aquila Change start
  - type: Damageable
    damageModifierSet: GlassMod
  # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # Aquila Change
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      # Aquila Change start
      - !type:ChangeConstructionNodeBehavior
        node: TelescreenFrame
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 0
            max: 2
          SurveillanceCameraMonitorCircuitboard:
            min: 0
            max: 1
      # Aquila Change end
  - type: Construction
    graph: WallmountTelescreen
    node: Telescreen
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#b89f25"
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
    prefix: device-address-prefix-camera-monitor # Aquila Change
  - type: WiredNetworkConnection
  - type: DeviceNetworkRequiresPower
  - type: SurveillanceCameraMonitor
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
        enum.SurveillanceCameraMonitorUiKey.Key:
          type: SurveillanceCameraMonitorBoundUserInterface

- type: entity
  parent: [ BaseWallmountMetallic, StructureHealthMachineFlimsy ] # Aquila Change
  id: WallmountTelescreenFrame
  name: telescreen frame
  description: Finally, some decent reception around here...
  components:
  - type: Construction
    graph: WallmountTelescreen
    node: TelescreenFrame
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    # Aquila Change start
    - map: ["computerLayerBody"]
      state: telescreen_frame
    - map: ["computerLayerScreen"]
      state: telescreen
    # Aquila Change end
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      # Aquila Change start
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      # Aquila Change end
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            # Aquila Change start
            min: 0
            max: 2
            # Aquila Change end
