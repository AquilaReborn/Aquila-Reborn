- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineWeak ] # Aquila Change
  id: AirAlarm
  name: air alarm
  description: An air alarm. Alarms... air?
  components:
  - type: StationAiWhitelist
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: DeviceNetwork
    deviceNetId: AtmosDevices
    receiveFrequencyId: AtmosMonitor
    transmitFrequencyId: AtmosMonitor
    prefix: device-address-prefix-air-alarm
    sendBroadcastAttemptEvent: true
  - type: WiredNetworkConnection
  # for output status ports
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceList
  - type: DeviceNetworkRequiresPower
  - type: DeviceLinkSource
    ports:
    - AirDanger
    - AirWarning
    - AirNormal
    lastSignals:
      AirDanger: false
      AirWarning: false
      AirNormal: false
  - type: AtmosAlarmable
    syncWith:
    - AirAlarm
    - AirSensor
    - GasVent
    - GasScrubber
  - type: AtmosAlarmableVisuals
    layerMap: "airAlarmState"
    alarmStates:
      Normal: alarm0
      Warning: alarm1
      Danger: alarm2
    hideOnDepowered: [ "airAlarmState" ]
  - type: Tag
    tags:
      - AirAlarm
  - type: AtmosDevice
  - type: AirAlarm
  - type: AtmosAlertsDevice
    group: AirAlarm
  - type: Clickable
  - type: InteractionOutline
  # Aquila Change start
  - type: ActivatableUI
    key: enum.SharedAirAlarmInterfaceKey.Key
  # Aquila Change end
  - type: UserInterface
    interfaces:
      enum.SharedAirAlarmInterfaceKey.Key:
        type: AirAlarmBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUIRequiresPower # Aquila Change
  - type: WiresPanel
  - type: Wires
    boardName: wires-board-name-airalarm
    layoutId: AirAlarm
  - type: AccessReader
    access: [["Atmospherics"]] # Aquila Change
  - type: ContainerFill
    containers:
      board: [ AirAlarmElectronics ]
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Appearance
  - type: WiresVisuals
  - type: Sprite
    # Aquila Change start
    sprite: Structures/Wallmounts/air-alarm.rsi
    offset: 0, -0.25
    # Aquila Change end
    layers:
    - state: base # Aquila Change
    - state: alarm0
      shader: unshaded # Aquila Change
      map: ["airAlarmState"] # TODO: fire alarm enum
    - state: panel # Aquila Change
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Construction
    graph: AirAlarm
    node: air_alarm
  - type: Destructible
    thresholds:
    # Aquila Change start
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4
    # Aquila Change end
  - type: GuideHelp
    guides:
    - AirAlarms
    - DeviceMonitoringAndControl

- type: entity
  parent: [ BaseWallmountMetallic, StructureHealthMachineFlimsy ] # Aquila Change
  id: AirAlarmAssembly
  name: air alarm assembly
  description: An air alarm. Doesn't look like it'll be alarming air any time soon.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/air-alarm.rsi # Aquila Change
    layers:
    - state: panel # Aquila Change
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          # Aquila Change start
          assembly: { state: panel }
          electronics: { state: panel }
          # Aquila Change end
  - type: Construction
    graph: AirAlarm
    node: assembly
  - type: Transform
    anchored: true
  - type: Destructible
    thresholds:
    # Aquila Change start
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4
    # Aquila Change end

- type: entity
  id: AirAlarmXeno
  parent: AirAlarm
  name: air alarm
  description: An alien air alarm. Hopefully they didn't breathe poison.
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/air_monitors_xeno.rsi
    layers:
    - state: alarmp
      map: ["airAlarmBase"]  # TODO: fire alarm enum
    - state: alarm0
      map: ["airAlarmState"]
    - state: alarmx
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Construction

- type: entity
  id: AirAlarmAssemblyXeno
  parent: AirAlarmAssembly
  name: air alarm assembly
  description: An alien air alarm. Why are the wires pulsating?...
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/air_monitors_xeno.rsi
    layers:
    - state: alarm_b1
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Construction
    # Aquila Change start
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4
    # Aquila Change end
