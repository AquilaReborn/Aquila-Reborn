- type: entity
  id: FloorLiquidPlasmaEntity
  name: liquid phoron # Aquila Change
  description: Sweet, expensive nectar. Don't consume.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#c906f3" # Aquila Change
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
    # Aquila Change start
    triggerGroups: # Goobstation
      types:
      - Lava
    # Aquila Change end
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  # Goobstation - fishing
  # Aquila Change start
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: PlasmaFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  # Aquila Change end
  # Goobstation - fishing
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-phoron.rsi # Aquila Change
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-phoron.rsi # Aquila Change
    state: full
  - type: IconSmooth
    # Aquila Change start
    key: phoron
    base: water
    additionalKeys:
    - walls
    # Aquila Change end
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
      # Goobstation - fishing
      # Aquila Change start
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
      # Aquila Change end
    # Goobstation - fishing
  - type: Tag
    tags:
    - HideContextMenu
  # Aquila Change start
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay
  - type: PlacementReplacement
    key: tileOverlay
  # Aquila Change end
