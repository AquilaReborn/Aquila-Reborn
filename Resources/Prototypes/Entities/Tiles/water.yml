- type: entity
  parent: SolutionTile # Aquila Change
  id: FloorWaterEntity
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-water.rsi # Aquila Change
    drawdepth: BelowFloor
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 7680 # Aquila Change
        reagents:
        - ReagentId: Water
          Quantity: 7680 # Aquila Change
  - type: SolutionRegeneration
    solution: pool # Aquila Change
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
      # Goobstation - fishing
      # Aquila Change start
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
      # Aquila Change end
      # Goobstation - fishing
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
  # Goobstation - fishing
  # Aquila Change start
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: WaterFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  # Aquila Change end
  # Goobstation - fishing
  # Aquila Change start
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay
  - type: IconSmooth
    key: water
    base: water
    additionalKeys:
    - walls
  - type: PlacementReplacement
    key: tileOverlay

- type: entity
  parent: FloorWaterEntity
  id: FloorSwimmingPoolEntity
  name: swimming pool
  description: Refreshing and relaxing!
  components:
  - type: FloorOccluder
  - type: Sprite
    sprite: Tiles/TileEntities/swimming-pool.rsi
  - type: IconSmooth
    key: pool
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  # Aquila Change end
