# Modifier sets for entities that can be described as fully (or mostly) composed of some specific material

#region Metallic
## Metals resist brute, making them resilient to common attacks and especially bullets.
## Neutral against burns, making burn the preferred damage to destroy it.

# Extremely strong metal that's unavailable to crew.
# Aquila Change start
- type: damageModifierSet
  id: PlastitaniumMod
  coefficients:
    Piercing: 0.7 # Bullets aren't a good option against metal
  flatReductions:
    Blunt: 20
    Slash: 20
    Piercing: 20
    Heat: 20
    Cold: 20
    Shock: 20
    Caustic: 20
    Structural: 9
# Aquila Change end

# Strong metal used by crew to protect important areas and items.
# Used for static entities which mostly never move.
# Aquila Change start
- type: damageModifierSet
  id: PlasteelStaticMod
  coefficients:
    Piercing: 0.7 # Bullets aren't a good option against metal
  flatReductions:
    Blunt: 15
    Slash: 15
    Piercing: 15
    Heat: 15
    Cold: 15
    Shock: 15
    Caustic: 15
    Structural: 6
# Aquila Change end

# Strong metal used by crew to protect important areas and items.
# Used for dynamic entities which might move frequently.
# Aquila Change start
- type: damageModifierSet
  id: PlasteelMod
  coefficients:
    Piercing: 0.7 # Bullets aren't a good option against metal
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Heat: 10
    Cold: 10
    Shock: 15
    Caustic: 15
    Structural: 6
# Aquila Change end

