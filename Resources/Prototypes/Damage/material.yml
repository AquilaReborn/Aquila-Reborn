#region Organic
## Poor resistances with specific, obvious weaknesses.

# Aquila Change start
- type: damageModifierSet
  id: CardboardMod
  coefficients:
    Blunt: 1.5
    Slash: 2
    Heat: 2
    Structural: 2 # Falls apart no matter what you do to it

- type: damageModifierSet
  id: WoodMod
  coefficients:
    Slash: 1.5
    Heat: 1.5
  flatReductions:
    Blunt: 4 # Minecraft reference
    Piercing: 4
# Aquila Change end

