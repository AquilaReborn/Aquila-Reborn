- type: entity
  id: SpinHitEffect
  components:
  - type: TimedDespawn
    lifetime: 0.60
  - type: Transform
    noRot: true
  - type: Sprite
    scale: 0.5, 0.5
    noRot: true
    sprite: _Aquila/Effects/Spin/SpinHitEffect.rsi
    state: spinHitEffect
    shader: unshaded
    netsync: false
    drawdepth: Effects

- type: entity
  id: SpinEmpowerEffect
