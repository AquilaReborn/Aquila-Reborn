# Заполненные аугменты

- type: entity
  parent: AugmentPowerCellSlot
  id: AugmentPowerCellSlotFilled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
          - PowerCell
        blacklist:
          tags:
          - PowerCage

- type: entity
  parent: AugmentToolsPanel
  id: AugmentToolsPanelFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: Crowbar
    - id: Wrench
    - id: Screwdriver
    - id: Wirecutter
    - id: Welder
    - id: Multitool

- type: entity
  parent: AugmentBotanyPanel
  id: AugmentBotanyPanelFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: HydroponicsToolMiniHoe
    - id: HydroponicsToolSpade
    - id: HydroponicsToolHatchet
    - id: HydroponicsToolClippers

- type: entity
  parent: AugmentPaperworkPanel
  id: AugmentPaperworkPanelFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: BoxFolderBlue
    - id: HandLabeler
    - id: RubberStampApproved
    - id: RubberStampDenied

- type: entity
  parent: AugmentSurgicalPanel
  id: AugmentSurgicalPanelFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: Scalpel
    - id: Retractor
    - id: Hemostat
    - id: SawElectric
    - id: Drill
    - id: Cautery

# Админские автохирурги

- type: entity
  abstract: true
  parent: BaseAutosurgeonSingle
  id: BaseAutosurgeonAdmin
  suffix: Admin
  description: A reusable autosurgeon for installing augments. Not for mere mortals.

- type: entity
  parent: BaseAutosurgeonAdmin
  id: AutosurgeonAdminPowerCellSlot
  name: autosurgeon (power cell slot augment)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: powerCell
    newPartProto: AugmentPowerCellSlotFilled
    oneTimeUse: false
    createOrganSlot: true
    doAfterTime: 3

