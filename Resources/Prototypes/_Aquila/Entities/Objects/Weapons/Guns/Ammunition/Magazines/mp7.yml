- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: MagazineMP7
  name: MP7 magazine (.35 auto)
  description: 45-round extended magazine for the MP7 submachine gun.
  components:
  - type: Tag
    tags:
    - MagazineMP7
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgePistol
    whitelist:
      tags:
      - CartridgePistol
    capacity: 45
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: base
      right:
      - state: base
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Aquila/Objects/Weapons/Guns/Ammunition/Magazines/mp7_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroNoAmmo: true
  - type: Appearance

