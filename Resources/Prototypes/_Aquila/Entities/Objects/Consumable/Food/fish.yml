- type: entity
  parent: FoodMeatRawBase
  id: FoodFishFilletSalmon
  name: salmon fillet
  description: A fresh cut of salmon, still smelling of the sea.
  components:
  - type: FlavorProfile
    flavors:
      - fishy
  - type: Sprite
    sprite: _Aquila/Objects/Consumables/Food/seafood.rsi
    state: salmonfillet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: UncookedAnimalProteins
          Quantity: 2
  - type: Construction
    graph: FishSteakSalmon
    node: start
    defaultTarget: salmon steak
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    storedOffset: -1,1
    inhandVisuals:
      left:
      - state: generic-pink-inhand-left
      right:
      - state: generic-pink-inhand-right

