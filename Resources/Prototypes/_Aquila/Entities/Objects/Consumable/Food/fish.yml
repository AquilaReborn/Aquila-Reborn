    flavors:
      - fishy
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _Aquila/Objects/Consumables/Food/seafood.rsi
    state: salmonsteak
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Protein
          Quantity: 5
  - type: Construction
    graph: FishSteakSalmon
    node: salmon steak
  - type: Item
    sprite: Objects/Consumable/Food/meat.rsi
    storedOffset: -1,1
    inhandVisuals:
      left:
      - state: plain-cooked-inhand-left
      right:
      - state: plain-cooked-inhand-right

