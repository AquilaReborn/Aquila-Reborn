- type: entity
  name: Horse
  parent: MobHorse
  id: MobHorseTest
  description: A thousand years of space evolution and this is the best we could come up with.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Aquila/Mobs/Vehicle/horse.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: horse
  #- type: HTN
  #  enabled: false
  - type: VehicleSafety
  - type: VehicleStaminaFall
    stunDuration: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.6
          position: "0, 0"
        density: 100
        mask:
          - MobMask
        layer:
          - MobLayer
        hard: true
  - type: Strap
    position: Stand
    blockMovement: false
  - type: InputMover
  - type: Vehicle
    requiredHands: 0
    engineRunning: true
    renderOver: None
  - type: VehicleGallop
    interval: 3
    windowLength: 1
    intervalStepPerStreak: 0.3
    windowLengthStepPerStreak: 0.1
    minInterval: 1
    minWindowLength: 0.4
    gallopSuccessSound:
    path: /Audio/_Goobstation/Effects/Sprinting/sprint_puff.ogg
    successCloudEffect: SprintAnimation
    stepCloudEffect: SmallSprintAnimation
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      200: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: horse
      Critical:
        Base: dead
      Dead:
        Base: dead

- type: entity
  parent: BaseAction
  id: ActionGallop
  name: Speed
  description: SPEEEEEED
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
  - type: InstantAction
    event: !type:GallopActionEvent
