- type: reagent
  id: Neuroadaptin
  name: reagent-name-neuroadaptin
  group: Medicine
  desc: reagent-desc-neuroadaptin
  physicalDesc: reagent-physical-desc-glowing
  flavor: medicine
  color: "#3FD0C9"
  metabolisms:
    Medicine:
      effects:
      - !type:AdjustCyberStrain
        amount: -1.5
      - !type:SuppressCyberpsychosis
        time: 15
      - !type:CyberpsychosisResistance
        time: 180
        multiplier: 0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Neuroadaptin
          min: 20
        damage:
          types:
            Poison: 1.5

- type: reaction
  id: Neuroadaptin
  reactants:
    Inaprovaline:
      amount: 1
    Silicon:
      amount: 1
    Lithium:
      amount: 1
  products:
    Neuroadaptin: 2

- type: entity
  parent: [ BaseHypospray, BaseSyndicateContraband ]
  id: NeuroadaptinInhaler
  name: neuroadaptin inhaler
  description: A compact inhaler that slowly synthesizes neuroadaptin on its own. A puff helps the body get used to freshly installed implants, dulls cyberpsychosis symptoms and lowers the risk of it getting worse.
  components:
  - type: Sprite
    sprite: _Aquila/Objects/Specific/Medical/neuroadaptin_inhaler.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
    size: Small
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 5
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
        reagents:
        - ReagentId: Neuroadaptin
          Quantity: 15
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: Neuroadaptin
        Quantity: 1
    duration: 12
  - type: UseDelay
    delay: 1

- type: listing
  id: UplinkNeuroadaptinInhaler
  name: uplink-neuroadaptin-inhaler-name
  description: uplink-neuroadaptin-inhaler-desc
  productEntity: NeuroadaptinInhaler
  cost:
    Telecrystal: 15
  categories:
  - UplinkImplants

- type: reagent
  id: Cybersynaptin
  name: reagent-name-cybersynaptin
  group: Medicine
  desc: reagent-desc-cybersynaptin
  physicalDesc: reagent-physical-desc-starry
  flavor: medicine
  color: "#C2185B"
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:CyberpsychosisTherapy
        amount: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Add
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Cybersynaptin
          min: 40
        damage:
          types:
            Poison: 1

- type: reaction
  id: Cybersynaptin
  reactants:
    Neuroadaptin:
      amount: 1
    Haloperidol:
      amount: 1
    Silver:
      amount: 1
  products:
    Cybersynaptin: 2

- type: reagent
  id: Ferroanima
  name: reagent-name-ferroanima
  group: Medicine
  desc: reagent-desc-ferroanima
  physicalDesc: reagent-physical-desc-metallic
  flavor: medicine
  color: "#C9A93F"
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:AdjustCyberTolerance
        amount: 0.2
      - !type:AdjustCyberStrain
        conditions:
        - !type:ReagentCondition
          reagent: Ferroanima
          min: 10
        amount: 1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ferroanima
          min: 10
        damage:
          types:
            Poison: 1

- type: reaction
  id: Ferroanima
  minTemp: 400
  reactants:
    Cybersynaptin:
      amount: 2
    Phalanximine:
      amount: 1
    Gold:
      amount: 1
    Plasma:
      amount: 1
  products:
    Ferroanima: 2
