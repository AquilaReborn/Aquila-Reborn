- type: entity
  parent: BaseComputer
  id: BudgetConsole
  name: budget console
  suffix: Экономика
  description: A terminal with the log of station budget transactions.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
  - type: BudgetConsole
    maxEntries: 200
  - type: ActivatableUI
    key: enum.BudgetConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.BudgetConsoleUiKey.Key:
        type: BudgetConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: AccessReader
    access: [["Command"]]
  - type: ActivatableUIRequiresAccess
