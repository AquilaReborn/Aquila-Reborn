# Запасные ценовые категории для торговых автоматов.
# Основные цены заданы в vending_price_list.yml, а эти правила применяются только к предметам,
# у которых нет цены в прайс-листе ни у самих, ни у их предков (например, новые апстримные предметы).

- type: vendingPriceCategory
  id: VendingPriceCash
  price: 100
  priority: 300
  components: [ Cash ]

- type: vendingPriceCategory
  id: VendingPriceGun
  price: 400
  priority: 200
  components: [ Gun ]

- type: vendingPriceCategory
  id: VendingPriceClothing
  price: 55
  priority: 100
  slots: [ head, eyes, ears, mask, outerclothing, innerclothing, neck, back, belt, gloves, feet ]

- type: vendingPriceCategory
  id: VendingPriceSnack
  price: 25
  priority: 60
  tags: [ FoodSnack ]

- type: vendingPriceCategory
  id: VendingPriceDrink
  price: 25
  priority: 55
  components: [ Edible, Spillable ]

- type: vendingPriceCategory
  id: VendingPriceFood
  price: 25
  priority: 50
  components: [ Edible ]

- type: vendingPriceCategory
  id: VendingPriceDefault
  price: 50
