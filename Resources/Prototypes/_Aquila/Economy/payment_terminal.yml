- type: entity
  parent: BaseItem
  id: PaymentTerminal
  name: payment terminal
  suffix: Экономика
  description: Takes card payments on the spot and records the payment purpose in the transaction history.
  components:
  - type: Sprite
    sprite: _Aquila/Objects/Economy/payment_terminal.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: PaymentTerminal
    printSound: /Audio/Machines/short_print_and_rip.ogg
  - type: ActivatableUI
    key: enum.PaymentTerminalUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PaymentTerminalUiKey.Key:
        type: PaymentTerminalBoundUserInterface

- type: entity
  parent: PaymentTerminal
  id: PaymentTerminalSecurity
  name: fine terminal
  suffix: Экономика
  description: Issues Security fines and takes card payment into the department budget.
  components:
  - type: Sprite
    sprite: _Aquila/Objects/Economy/security_terminal.rsi
  - type: PaymentTerminal
    fineOnly: true
  - type: AccessReader
    access: [["Security"]]
  - type: ActivatableUIRequiresAccess
