- type: entity
  abstract: true
  parent: BaseItem
  id: BaseTranslatorChip
  name: translator chip
  description: A chip with a language database. Insert it into a translator implant to learn the language.
  components:
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi
    state: crypt_blue
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 30

- type: entity
  parent: BaseSubdermalImplant
  id: TranslatorChipImplant
  categories: [ HideSpawnMenu ]
  name: translator implant
  description: An implant with slots for translator chips. Every inserted chip gives its owner knowledge of a language.
  components:
  - type: TranslatorChipHolder

- type: entity
  parent: BaseImplantOnlyImplanter
  id: TranslatorChipImplanter
  name: translator implanter
  components:
  - type: Implanter
    implant: TranslatorChipImplant

- type: latheRecipe
  parent: BaseTranslatorImplanter
  id: TranslatorChipImplanter
  name: lathe-recipe-TranslatorChipImplanter-name
  result: TranslatorChipImplanter

- type: entity
  parent: BaseTranslatorChip
  id: BasicTauCetiBasicTranslatorChip
  name: basic common translator chip
  components:
