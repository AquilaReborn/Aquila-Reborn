# Работа выполнена Claude (Anthropic).
# ==========================================================
# Песочные часы Жнецов (SoT).
# Общая база HourglassSoTBase лежит в hourglass_athena.yml.
# ==========================================================

# --- База Жнецов (в спавн-меню не видна) ---
- type: entity
  abstract: true
  parent: HourglassSoTBase
  id: HourglassReapersBase
  name: песочные часы Жнецов
  description: Странные часы, позволяющие сражаться против Стражей сокровищ. При уничтожении часов вы проиграете.
  components:
  - type: Sprite
    state: reapers
  - type: SotHourglass
    side: Reapers
  - type: AnnounceOnDestruction
    sender: "Песочные часы судьбы"
    message: "Песочные часы Жнецов уничтожены!"
    color: "#ff0000"

# ---------- Для шаттлов на 1-2 человека (хватает 1 голоса) ----------

- type: entity
  parent: HourglassReapersBase
  id: HourglassReapers
  suffix: SoT, reapers1, 1-2 чел.
  components:
  - type: ShuttleLink
    id: reapers1
  - type: SotHourglass
    requiredVotes: 1

- type: entity
  parent: HourglassReapersBase
  id: HourglassReapers2
  suffix: SoT, reapers2, 1-2 чел.
  components:
  - type: ShuttleLink
    id: reapers2
  - type: SotHourglass
    requiredVotes: 1

- type: entity
  parent: HourglassReapersBase
  id: HourglassReapers3
  suffix: SoT, reapers3, 1-2 чел.
  components:
  - type: ShuttleLink
    id: reapers3
  - type: SotHourglass
    requiredVotes: 1

# ---------- Для шаттлов на 4 человека (нужно 3 голоса) ----------

