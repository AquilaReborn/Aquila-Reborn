# Работа выполнена Claude (Anthropic).
# ==========================================================
# Песочные часы SoT: общая база и часы Афины.
# Варианты: ID привязки (athena1-3) x размер экипажа (1-2 или 4 человека).
# Внешне и по функционалу одинаковы, различаются ID, суффиксом в спавн-меню
# и числом голосов, нужных для готовности к битве (и для её отмены).
# ==========================================================

# --- Общая база всех песочных часов SoT (в спавн-меню не видна) ---
- type: entity
  abstract: true
  parent: BaseStructure
  id: HourglassSoTBase
  suffix: SoT
  components:
  # --- Спрайт ---
  - type: Sprite
    sprite: _Aquila/SoT/hourglass.rsi
    drawdepth: Overdoors

  # --- Прикрепление к полу ---
  - type: Anchorable
    flags: Anchorable
  - type: Transform
    anchored: true

  # --- Коллизия ---
  - type: Physics
    bodyType: Static
    canCollide: true

  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer

  # --- Получение урона ---
  - type: Damageable
    damageContainer: StructuralInorganic

  # --- Состояние часов при осмотре (по мере повреждения) ---
  - type: ExaminableDamage
    messages: SotHourglassDamageMessages

  # --- Параметры взрыва при уничтожении ---
  - type: Explosive
    explosionType: HardBomb
    totalIntensity: 20000
    intensitySlope: 3
    maxIntensity: 15

  # --- Разрушение + взрыв ---
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

  # --- Обводка при наведении ---
  - type: InteractionOutline

  # --- UI: голосование экипажа за готовность к битве ---
  - type: ActivatableUI
    key: enum.SotHourglassUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SotHourglassUiKey.Key:
        type: SotHourglassBoundUserInterface

# --- База Афины (в спавн-меню не видна) ---
- type: entity
  abstract: true
  parent: HourglassSoTBase
  id: HourglassAthenaBase
  name: песочные часы Афины
  description: Странные часы, позволяющие сражаться против Служителей пламени. При уничтожении часов вы проиграете.
  components:
  - type: Sprite
    state: athena
  - type: SotHourglass
    side: Athena
  - type: AnnounceOnDestruction
    sender: "Песочные часы судьбы"
    message: "Песочные часы Афины уничтожены!"
    color: "#0000ff"

# ---------- Для шаттлов на 1-2 человека (хватает 1 голоса) ----------

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthena
  suffix: SoT, athena1, 1-2 чел.
  components:
  - type: ShuttleLink
    id: athena1
  - type: SotHourglass
    requiredVotes: 1

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthena2
  suffix: SoT, athena2, 1-2 чел.
  components:
  - type: ShuttleLink
    id: athena2
  - type: SotHourglass
    requiredVotes: 1

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthena3
  suffix: SoT, athena3, 1-2 чел.
  components:
  - type: ShuttleLink
    id: athena3
  - type: SotHourglass
    requiredVotes: 1

# ---------- Для шаттлов на 4 человека (нужно 3 голоса) ----------

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthenaLarge
  suffix: SoT, athena1, 4 чел.
  components:
  - type: ShuttleLink
    id: athena1
  - type: SotHourglass
    requiredVotes: 3

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthenaLarge2
  suffix: SoT, athena2, 4 чел.
  components:
  - type: ShuttleLink
    id: athena2
  - type: SotHourglass
    requiredVotes: 3

- type: entity
  parent: HourglassAthenaBase
  id: HourglassAthenaLarge3
  suffix: SoT, athena3, 4 чел.
  components:
  - type: ShuttleLink
    id: athena3
  - type: SotHourglass
    requiredVotes: 3
