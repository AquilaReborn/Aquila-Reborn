    - /Audio/_Aquila/EventContent/CrookLv/entree.ogg
    - /Audio/_Aquila/EventContent/CrookLv/inbound.ogg
    - /Audio/_Aquila/EventContent/CrookLv/mastery.ogg
    - /Audio/_Aquila/EventContent/CrookLv/soldier.ogg
    - /Audio/_Aquila/EventContent/CrookLv/threat_and_prey.ogg
