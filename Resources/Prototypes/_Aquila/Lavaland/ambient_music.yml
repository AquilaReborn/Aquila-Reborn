- type: rules
  id: OnLavaland
  rules:
    - !type:OnMapGridRule
    - !type:NearbyTilesPercentRule
      percent: 0.5
      tiles:
        - FloorBasaltLavaland
        - FloorPlanetAsh
        - FloorPlanetGrassLight
