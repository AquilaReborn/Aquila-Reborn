- type: entity
  abstract: true
  id: BaseAutoCooker
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseSmallConstructibleMachineDestructible, BaseAutomatedMachine ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Sprite
    sprite: _Aquila/Structures/Machines/autocooker.rsi
    layers:
    - state: off
    - state: off
      map: [ "overlay" ]
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AutoCookerVisuals.State:
        overlay:
          Off: { state: off }
          Normal: { state: normal-unshaded }
          Cooking: { state: cooking-unshaded }
          Done: { state: done-unshaded }
  - type: ApcPowerReceiver
    powerLoad: 70
  - type: ActivatableUI
    key: enum.AutoCookerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.AutoCookerUiKey.Key:
        type: AutoCookerBoundUserInterface
  - type: ScreenNoiseUi
  - type: Pullable
  - type: WiresPanel
  - type: Speech
    speechVerb: Robotic
    speechSounds: Vending
  - type: Vocalizer
    minVocalizeInterval: 8m
    maxVocalizeInterval: 10m
    hideChat: true
  - type: VocalizerRequiresPower
  - type: StartableMachine # сигнал Start повторяет последний заказ
  - type: GuideHelp
    guides:
    - AutoCookers
    - Automation

- type: entity
  abstract: true
  id: BaseAutoCookerSynthesizer
  parent: BaseAutoCooker
  components:
  - type: AutoCooker
    beakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
      priority: 9
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      autoCookBeakerSlot: !type:ContainerSlot
  - type: EmptyOnMachineDeconstruct
    containers:
    - autoCookBeakerSlot
  - type: AutomationSlots
    slots:
    - !type:AutomatedItemSlot
      input: AutomationSlotBeaker
      output: AutomationSlotBeaker
      slotId: autoCookBeakerSlot
    - !type:AutomatedBeakerSlot
      input: PlumbingDispenser
      output: PlumbingDispenser
      slotName: autoCookBeakerSlot

- type: entity
  id: AutoCookerBar
  parent: BaseAutoCookerSynthesizer
  name: auto-bartender
  description: Mixes cocktails and drinks on its own. Synthesizes ingredients from energy.
  components:
  - type: Machine
    board: AutoCookerBarMachineCircuitboard
  - type: AccessReader
    access: [["Bar"]]
  - type: DatasetVocalizer
    dataset: AutoBartenderAds
  - type: SpeakOnUIClosed
    pack: AutoBartenderGoodbyes
  - type: AutoCooker
    kind: Bar
    allowedMixing:
    - Shake
    - Stir
    targetMetabolisms:
    - Alcohol
    - Drink
    baseMetabolisms:
    - Alcohol
    - Drink
    baseReagents:
    - Water
    - Sugar

- type: entity
  id: AutoCookerChem
  parent: BaseAutoCookerSynthesizer
  name: auto-chemist
  description: Synthesizes basic medicine on its own, step by step, from base elements made out of energy.
  components:
  - type: Machine
    board: AutoCookerChemMachineCircuitboard
  - type: AccessReader
    access: [["Chemistry"]]
  - type: DatasetVocalizer
    dataset: AutoChemistAds
  - type: SpeakOnUIClosed
    pack: AutoChemistGoodbyes
  - type: AutoCooker
    kind: Chem
    allowedMixing:
    - Stir
    - Shake
    - Centrifuge
    - Electrolysis
    targetGroups:
    - Medicine
    excludedReagents:
    - Holywater
    - Ambuzol
    listBaseReagents: true
    bufferSolution: buffer
    maxReactions: 1 # средние и сложные препараты собираются цепочкой: промежуточные реагенты подаются в буфер
    complexWhitelist: # базовая медицина, которую можно сделать несмотря на сложность
    - Bicaridine
    - Dermaline
    - Hyronalin
    - Tricordrazine
    - Saline
    - Spaceacilin
    baseReagents:
    - Aluminium
    - Carbon
    - Chlorine
    - Copper
    - Ethanol
    - Fluorine
    - Hydrogen
    - Iodine
    - Iron
    - Lithium
    - Mercury
    - Nitrogen
    - Oxygen
    - Phosphorus
    - Potassium
    - Radium
    - Silicon
    - Sodium
    - Sugar
    - Sulfur
    - Water
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 300
        canReact: false # реагенты из разных источников не должны реагировать до этапов синтеза
  - type: DumpableSolution
    solution: buffer
  - type: ExaminableSolution
    solution: buffer
  - type: AutomationSlots
    slots:
    - !type:AutomatedItemSlot
      input: AutomationSlotBeaker
      output: AutomationSlotBeaker
      slotId: autoCookBeakerSlot
    - !type:AutomatedBeakerSlot
      input: PlumbingDispenser
      output: PlumbingDispenser
      slotName: autoCookBeakerSlot
    - !type:AutomatedSolution
      input: PlumbingInput
      output: PlumbingOutput
      solutionName: buffer

- type: entity
  id: AutoCookerKitchen
  parent: BaseAutoCooker
  name: auto-cook
  description: Cooks dishes step by step from the ingredients stored inside. The storage is refrigerated, so food does not spoil.
  components:
  - type: Machine
    board: AutoCookerKitchenMachineCircuitboard
  - type: AccessReader
    access: [["Kitchen"]]
  - type: DatasetVocalizer
    dataset: AutoCookAds
  - type: SpeakOnUIClosed
    pack: AutoCookGoodbyes
  - type: AutoCooker
    kind: Kitchen
    freeIngredients: # посуда не нужна, блюдо выдаётся без неё
    - FoodBowlBig
    - FoodPlate
    - FoodPlateSmall
    - FoodPlateTin
    - FoodPlateMuffinTin
  - type: AntiRottingContainer
  - type: Storage
    openOnActivate: false
    maxItemSize: Normal
    grid:
    - 0,0,9,5
  - type: UserInterface
    interfaces:
      enum.AutoCookerUiKey.Key:
        type: AutoCookerBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: SolutionContainerManager
    solutions:
      pantry:
        maxVol: 400
        canReact: false # реакции идут только этапами готовки, как в криостазисной мензурке
  - type: RefillableSolution
    solution: pantry
  - type: ExaminableSolution
    solution: pantry
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      storagebase: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - storagebase
  - type: AutomationSlots
    slots:
    - !type:AutomatedStorage
      input: AutomationSlotInput
      output: AutomationSlotInput
    - !type:AutomatedSolution
      input: PlumbingInput
      output: PlumbingOutput
      solutionName: pantry

