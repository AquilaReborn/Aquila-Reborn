- type: Tag
  id: ArmorPlate

- type: localizedDataset
  id: ArmorPlateMessages
  values:
    prefix: armor-plate-damaged-
    count: 5

- type: entity
  parent: BaseItem
  id: ArmorPlateBallistic
  name: bulletproof armor plate
  description: A heavy ceramic plate that absorbs the kinetic energy of bullets. Conveniently hangs on your jumpsuit.
  components:
  - type: ExaminableDamage
    messages: ArmorPlateMessages
  - type: Tag
    tags:
    - ArmorPlate
  - type: Armor
    coverage:
    - Chest
    - Groin
    modifiers:
      coefficients:
        Piercing: 0.8
        Blunt: 0.95
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Materials/Sheets/metal.rsi
    state: plasteel
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

