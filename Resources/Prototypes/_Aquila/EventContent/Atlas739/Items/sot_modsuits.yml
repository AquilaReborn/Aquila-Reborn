# Работа выполнена Claude (Anthropic).
# Скафандры MOD для сторон SoT: контроллер "Афина" и контроллер "Жнец".
# За основу взят Security (ClothingModsuitSecurity и его четыре части).
#
# СТРУКТУРА
#   Для каждого слота (контроллер, нагрудник, шлем, перчатки, ботинки) есть абстрактная ОСНОВА
#   (...SotBase) и два дочерних прототипа (Афина, Жнец). Все общие параметры лежат в основе,
#   дочерние меняют только название, описание и текстуры.
#
# ГДЕ ЧТО МЕНЯТЬ (ищите в файле пометки "ИЗМЕНИТЬ")
#   - Резисты (все 50%): блоки  Armor.modifiers.coefficients,  ExplosionResistance,  StaminaResistance
#     в основах нагрудника, шлема и ботинок. Правка в основе действует сразу на обе стороны.
#   - Чтобы у сторон были РАЗНЫЕ резисты: скопируйте нужный блок "- type: Armor / modifiers / coefficients"
#     в дочерний прототип стороны и поменяйте цифры там (в дочернем достаточно указать только изменяемые типы урона).
#   - Названия и описания: поля name / description у дочерних прототипов.
#   - Текстуры: Resources/Textures/_Aquila/EventContent/Atlas739/Modsuits/<Athena|Reaper>/<back|outer|head|hands|shoes>.rsi
#   - Перчатки в оригинале (Security) брони не имеют, поэтому резистов в них нет.
#   - В отличие от Security: убраны контрабанда (BaseSecurityContraband) и ветка крафта (Construction);
#     контроллер выдаётся сразу с батареей PowerCellHigh.

- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitSotBase
  abstract: true
  name: контроллер скафандра MOD
  description: Основа контроллеров скафандров MOD SoT. Общие параметры обеих сторон.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/Modsuits/Athena/back.rsi  # дочерние прототипы подставляют свою сторону
  # ИЗМЕНИТЬ: стартовая батарея контроллера (PowerCellHigh = большая; можно PowerCellMedium и т.д.)
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
            - PowerCell
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed

- type: entity
  parent: ClothingOuterBase
  id: ClothingModsuitChestplateSotBase
  abstract: true
  name: нагрудник скафандра MOD
  description: Основа скафандров MOD SoT. Общие параметры обеих сторон.
  categories: [ HideSpawnMenu ]
  components:
  - type: ToggleHideLayersClothing # Aquila Change
    slots: OUTERCLOTHING # Aquila Change
    groups:
    - layers: [ Tail, TailBehind, TailBehindBackpack, TailOversuit, Wings ] # Aquila Change
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/Modsuits/Athena/outer.rsi  # дочерние прототипы подставляют свою сторону
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  # ИЗМЕНИТЬ: скорость (1.0 = без замедления, меньше = медленнее). Резистами не считается, оставлено как у Security.
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
      outerClothing-hydrakin:
      - state: equipped-OUTERCLOTHING-sealed-hydrakin
  # ИЗМЕНИТЬ: сопротивление взрывам (0.5 = урон от взрыва вдвое меньше).
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  # ИЗМЕНИТЬ: сопротивление стамине (0.5 = урон по стамине вдвое меньше).
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: Armor
    # ИЗМЕНИТЬ: защита от травм (вычет урона по телу). Не резист, оставлено как у Security.
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    # ИЗМЕНИТЬ: резисты брони. Коэффициент получаемого урона: 0.5 = защита 50%, 1 = без защиты, 0 = урон не проходит.
    # Типы урона можно добавлять и убирать (Blunt, Slash, Piercing, Heat, Cold, Shock, Radiation, Caustic ...).
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01
  - type: FireProtection
    reduction: 0.5

- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetSotBase
  abstract: true
  name: шлем скафандра MOD
  description: Основа скафандров MOD SoT. Общие параметры обеих сторон.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD-vox
      head-vulpkanin:
      - state: equipped-HEAD-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-feroxi
      head-hydrakin:
      - state: equipped-HEAD-hydrakin
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/Modsuits/Athena/head.rsi  # дочерние прототипы подставляют свою сторону
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: HideLayerClothing
    slots:
    - Snout
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      head-resomi:
      - state: equipped-HEAD-sealed-resomi
      head-vox:
      - state: equipped-HEAD-sealed-vox
      head-vulpkanin:
      - state: equipped-HEAD-sealed-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-sealed-feroxi
      head-hydrakin:
      - state: equipped-HEAD-sealed-hydrakin
  - type: Armor
    # ИЗМЕНИТЬ: защита от травм (вычет урона по телу). Не резист, оставлено как у Security.
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    # ИЗМЕНИТЬ: резисты брони. Коэффициент получаемого урона: 0.5 = защита 50%, 1 = без защиты, 0 = урон не проходит.
    # Типы урона можно добавлять и убирать (Blunt, Slash, Piercing, Heat, Cold, Shock, Radiation, Caustic ...).
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.01
      coolingCoefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
  #THIS WILL BE REPLACED WITH MODULE ↓↓
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    lightMask: ConeSingle
    autoRot: true
    netsync: true
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: Battery
    maxCharge: 600 #lights drain 3/s but recharge of 2 makes this 1/s. Therefore 600 is 10 minutes of light.
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2

