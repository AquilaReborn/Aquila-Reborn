# Работа выполнена Claude (Anthropic).
# Скафандры MOD для сторон SoT: контроллер "Афина" и контроллер "Жнец".
# ПЕРЕНЕСЕНО на новую систему ModSuit (апстрим-коммит 0cead4dbb "what if modular suits were modular", #7485):
# старая система SealableClothing удалена, вместо неё ModSuit (контроллер), ModPart (части), ModCore (ядро с батареей),
# ModTheme (тема: сложность, расход, время активации). Основой взят Security в его НОВОМ виде.
#
# СТРУКТУРА
#   Для каждого слота (контроллер, нагрудник, шлем, перчатки, ботинки) есть абстрактная ОСНОВА (...SotBase)
#   и два дочерних прототипа (Афина, Жнец). Общие параметры лежат в основе, дочерние меняют название,
#   описание и текстуры. У каждой стороны своя ТЕМА (ModThemeSotAthena / ModThemeSotReaper).
#
# ГДЕ ЧТО МЕНЯТЬ (ищите пометки "ИЗМЕНИТЬ")
#   - Резисты (все 50%): блоки Armor.modifiers.coefficients, ExplosionResistance, StaminaResistance в основах
#     нагрудника, шлема и ботинок. Правка в основе действует сразу на обе стороны.
#   - Чтобы резисты у сторон были РАЗНЫЕ: скопируйте блок "- type: Armor / modifiers / coefficients" в дочерний
#     прототип стороны и поменяйте цифры там (достаточно указать только изменяемые типы урона).
#   - Характеристики самого скафандра (сложность модулей, расход заряда, время активации, встроенные модули):
#     прототипы ModThemeSotAthena / ModThemeSotReaper внизу файла. Модули, выданные при создании: ModSuit.startingModules.
#   - Ядро/батарея: слот mod-core в основе контроллера (ModsuitCoreStandardHighCapacity = ядро с большой батареей).
#   - Названия и описания: поля name / description у дочерних прототипов.
#   - Текстуры: Resources/Textures/_Aquila/EventContent/Atlas739/Modsuits/<Athena|Reaper>/<back|outer|head|hands|shoes>.rsi
#   - Перчатки в оригинале (Security) брони не имеют, поэтому резистов в них нет.
#   - В отличие от Security: убраны контрабанда (BaseSecurityContraband) и ветка крафта (Construction) у частей.
#     ВНИМАНИЕ: контроллер наследует Construction от ClothingModsuitStandard (граф Modsuit, узел standard).

- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitSotBase
  abstract: true
  name: контроллер скафандра MOD
  description: Основа контроллеров скафандров MOD SoT. Общие параметры обеих сторон.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/Modsuits/Athena/back.rsi  # дочерние прототипы подставляют свою сторону
  # ИЗМЕНИТЬ: ядро со стартовой батареей. ModsuitCoreStandardHighCapacity = ядро с большой батареей,
  # ModsuitCoreStandard = пустое ядро (батарею вставляют вручную).
  - type: ItemSlots
    slots:
      mod-core:
        name: modsuit-core-slot-name
        startingItem: ModsuitCoreStandardHyper
        whitelist:
          components:
          - ModCore

- type: entity
  parent: ClothingOuterBase
  id: ClothingModsuitChestplateSotBase
  abstract: true
  name: нагрудник скафандра MOD
  description: Основа скафандров MOD SoT. Общие параметры обеих сторон.
  categories: [ HideSpawnMenu ]
  components:
  - type: ToggleHideLayersClothing
    slots: OUTERCLOTHING
    groups:
    - layers: [ Tail, TailBehind, TailBehindBackpack, TailOversuit, Wings ]
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/Modsuits/Athena/outer.rsi  # дочерние прототипы подставляют свою сторону
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  # ИЗМЕНИТЬ: скорость (1.0 = без замедления, меньше = медленнее). Здесь 1.0 - ваша правка, в оригинале Security 0.8.
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: ModPart
    sealUpPopup: modsuit-part-seal-up-chestplate
    sealDownPopup: modsuit-part-seal-down-chestplate
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
      outerClothing-hydrakin:
      - state: equipped-OUTERCLOTHING-sealed-hydrakin
  # ИЗМЕНИТЬ: сопротивление взрывам (0.5 = урон от взрыва вдвое меньше).
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  # ИЗМЕНИТЬ: сопротивление стамине (0.5 = урон по стамине вдвое меньше).
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: Armor
    # ИЗМЕНИТЬ: защита от травм (вычет урона по телу). Не резист, оставлено как у Security.
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    # ИЗМЕНИТЬ: резисты брони. Коэффициент получаемого урона: 0.5 = защита 50%, 1 = без защиты, 0 = урон не проходит.
    # Типы урона можно добавлять и убирать (Blunt, Slash, Piercing, Heat, Cold, Shock, Radiation, Caustic ...).
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
  # ИЗМЕНИТЬ: защита, которая включается только когда скафандр запечатан (давление, температура и т.д.).
  - type: ModSealedComponents
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01
  - type: FireProtection
    reduction: 0.5

