  #   complexityMax: 15      - сколько "сложности" модулей влезает (по умолчанию 15)
  #   chargeDrain: 0.8       - расход заряда в секунду (по умолчанию 0.8)
  inbuiltModules: [ ModsuitModuleDnaLock ]     # модули, встроенные в скафандр этой темы
  activationStepTime: 0.75
