# Работа выполнена Claude (Anthropic).
# ==========================================================
# Магазин закупок SoT для станций фракций (Афина и Жнецы).
#
# Как это работает (кратко):
#   1) Каждый корабль - отдельная станция (грид с BecomesStation + stationProto ниже),
#      у неё свой счёт в кредитах (StationBankAccount) и свой список рынков (Markets).
#   2) У КАЖДОЙ ФРАКЦИИ СВОЙ СЧЁТ (SotAthenaCargo / SotReapersCargo, см. ниже), а не общий "Cargo".
#      Это разделяет заказы: консоль показывает и позволяет одобрять/отменять только заказы СВОЕГО
#      счёта, даже если обе стороны по ошибке стоят на одной станции.
#   3) Консоль закупок (SotShopConsole*) показывает товары рынка своей фракции и списывает кредиты
#      со своего счёта. Деньги можно пополнить, вставив в консоль кредиты (стопку Credit).
#   4) Одобренный заказ появляется на телепаде закупок (SotShopTelepad*) своего корабля. Консоль и
#      телепады ТОЙ ЖЕ СТОРОНЫ на одном гриде связываются сами (SotShopLinkSystem): если на одном
#      гриде стоят телепады и консоли обеих фракций, они не перепутаются.
#   5) Список товаров лежит в sot_shop_products.yml (там же инструкция, как добавлять).
#
# Кладите в Resources/Prototypes/_Aquila/EventContent/Atlas739/
# ==========================================================

# ---------- Рынки (каталоги): у каждой фракции свой ----------
- type: cargoMarket
  id: SotAthenaMarket

- type: cargoMarket
  id: SotReapersMarket

# ---------- Счета (у каждой фракции свой, а не общий "Cargo") ----------
- type: cargoAccount
  id: SotAthenaCargo
  name: sot-shop-account-athena-name
  code: sot-shop-account-athena-code
  color: "#4060ff"
  radioChannel: Supply
  acquisitionSlip: PaperAcquisitionSlipCargo

- type: cargoAccount
  id: SotReapersCargo
  name: sot-shop-account-reapers-name
  code: sot-shop-account-reapers-code
  color: "#ff3a20"
  radioChannel: Supply
  acquisitionSlip: PaperAcquisitionSlipCargo

# ---------- Станции ----------
# stationProto для gameMap: счёт в кредитах + заказы + (по желанию) должности.
# В gameMap.stations.<ID из BecomesStation> укажите stationProto: SotStationAthena (или Reapers).

- type: entity
  id: SotStationAthena
  parent: [ BaseStation, BaseStationCargo, BaseStationJobsSpawning ]
  categories: [ HideSpawnMenu ]
  components:
  - type: StationBankAccount
    primaryAccount: SotAthenaCargo
    accounts:
      SotAthenaCargo: 3000  # стартовый баланс в кредитах
    revenueDistribution:
      SotAthenaCargo: 1.0
    increasePerSecond: 0    # без пассивного дохода (в обычной станции деньги капают сами)
  - type: StationCargoOrderDatabase
    capacity: 20            # сколько заказов может ждать одновременно
    markets:
    - SotAthenaMarket
    orders:
      SotAthenaCargo: []    # ключ счёта обязан существовать до первого заказа

- type: entity
  id: SotStationReapers
  parent: [ BaseStation, BaseStationCargo, BaseStationJobsSpawning ]
  categories: [ HideSpawnMenu ]
  components:
  - type: StationBankAccount
    primaryAccount: SotReapersCargo
    accounts:
      SotReapersCargo: 3000
    revenueDistribution:
      SotReapersCargo: 1.0
    increasePerSecond: 0
  - type: StationCargoOrderDatabase
    capacity: 20
    markets:
    - SotReapersMarket
    orders:
      SotReapersCargo: []

# ---------- Консоли закупок ----------
# Спрайт: корпус и экран свои (sot_shop_console.rsi), клавиатура, клавиши и панель - стандартные.

- type: entity
  id: SotShopConsoleAthena
  parent: ComputerCargoOrders
  name: консоль закупок Афины
  description: Здесь Афина закупает снаряжение перед боем. Оплата - кредиты со счёта корабля.
  suffix: SoT, Афина
  components:
  - type: SotShopConsole
    side: Athena
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      sprite: _Aquila/EventContent/Atlas739/sot_shop_console.rsi
      state: athena_computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      sprite: _Aquila/EventContent/Atlas739/sot_shop_console.rsi
      state: athena_screen
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: CargoOrderConsole
    account: SotAthenaCargo             # свой счёт: заказы другой стороны не видны и не редактируются
    allowedGroups: [ SotAthenaMarket ]  # какие рынки видны на этой консоли
    baseTransferLimit: 0                # 0 - нельзя снимать наличные со счёта (только закупки)
    removeLimitAccess: []
  - type: AccessReader
    access: []                          # без доступа: пользоваться может любой на корабле
  - type: ApcPowerReceiver
    needsPower: false                   # работает без питания (true - как обычная консоль)
  - type: PointLight
    color: "#4060ff"

- type: entity
  id: SotShopConsoleReapers
  parent: ComputerCargoOrders
  name: консоль закупок Жнецов
  description: Здесь Жнецы закупают снаряжение перед боем. Оплата - кредиты со счёта корабля.
  suffix: SoT, Жнецы
  components:
  - type: SotShopConsole
    side: Reapers
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      sprite: _Aquila/EventContent/Atlas739/sot_shop_console.rsi
      state: reapers_computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      sprite: _Aquila/EventContent/Atlas739/sot_shop_console.rsi
      state: reapers_screen
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: CargoOrderConsole
    account: SotReapersCargo            # свой счёт: заказы другой стороны не видны и не редактируются
    allowedGroups: [ SotReapersMarket ]
    baseTransferLimit: 0
    removeLimitAccess: []
  - type: AccessReader
    access: []
  - type: ApcPowerReceiver
    needsPower: false
  - type: PointLight
    color: "#ff3a20"

# ---------- Телепады закупок ("мостики", куда приходят заказы) ----------
# Нужны состояния offline, idle и beam: код телепада обращается к ним по именам.

- type: entity
  id: SotShopTelepadAthena
  parent: CargoTelepad
  name: телепад закупок Афины
  description: Сюда телепортируются заказы Афины.
  suffix: SoT, Афина
  components:
  - type: SotShopTelepad
    side: Athena
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/sot_shop_telepad_athena.rsi
  - type: ApcPowerReceiver
    needsPower: false                   # true - телепаду нужно питание

- type: entity
  id: SotShopTelepadReapers
  parent: CargoTelepad
  name: телепад закупок Жнецов
  description: Сюда телепортируются заказы Жнецов.
  suffix: SoT, Жнецы
  components:
  - type: SotShopTelepad
    side: Reapers
  - type: Sprite
    sprite: _Aquila/EventContent/Atlas739/sot_shop_telepad_reapers.rsi
  - type: ApcPowerReceiver
    needsPower: false
