# Работа выполнена Claude (Anthropic).
# ==========================================================
# Пресет SoT
# Кладите в Resources/Prototypes/_Aquila/EventContent/Atlas739/
# ==========================================================

# --- Пресет (команда: setgamepreset SoT) ---
- type: gamePreset
  id: SoT
  alias:
  - sot
  name: sot-title
  description: sot-description
  showInVote: false # только админский запуск
  rules:
  - SotRule
  # Станционные события, метеориты и антагонисты намеренно не подключены.

# --- Правило пресета: ведёт журнал битв ---
- type: entity
  parent: BaseGameRule
  id: SotRule
  components:
  - type: SotRule
    restartDelay: 30            # секунд до рестарта после sotroundend
    requireDifferentSides: true # битвы только Афина против Жнецов
    # --- выплаты на личные счета после каждой битвы (экономика aquila.economy) ---
    payoutEnabled: true
    winnerPayout: 10000         # каждому игроку фракции-победителя, кредитов
    loserPayout: 6000           # каждому игроку проигравшей фракции
    drawPayout: 5000              # каждому игроку обеих фракций при ничьей
    winnerCoefficient: 1        # множитель к выплате победителям (в игре: sotpayout)
    loserCoefficient: 1         # множитель к выплате проигравшим
