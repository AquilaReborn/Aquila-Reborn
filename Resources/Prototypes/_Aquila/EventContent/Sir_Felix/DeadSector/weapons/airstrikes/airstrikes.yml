- type: entity
  abstract: true
  parent: [BaseItem, BaseMinorContraband]
  id: BaseAirStrike
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 0
  - type: Damageable
    damageContainer: Inorganic
  - type: Appearance
  - type: AnimationPlayer

- type: entity
  parent: BaseAirStrike
  id: AirStrike
  name: Air strike
  description: Hey, look, the plane is flying! The plane... The plane is flying... Damn...
  suffix: DeadSector, Sir_Felix
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/Sir_Felix/Felix/Objects/OrbitalCall/imperial.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    capacity: 4
    delayBeforeTriggerContents: 0
    distance: 0
    velocity: 0
  - type: ContainerFill
    containers:
      cluster-payload:
        - ClusterDis8
        - ClusterDis16
        - ClusterDis24
        - ClusterDis32
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

