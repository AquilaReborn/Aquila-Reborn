- type: entity
  abstract: true
  parent: Paper
  id: BaseFactionLeaflet
  components:
  - type: Paper
    editingDisabled: true
    stampState: paper_stamp-generic

# CrookLv, Decor, LFC
- type: entity
  parent: BaseFactionLeaflet
  id: FactionLeafletClipMinutemen
  name: militia recruitment leaflet
  suffix: CrookLv, Decor, LFC
  description: A call to join a frontier militia.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#cfd8f0"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      color: "#2b4a9c"
      visible: false
  - type: Paper
    content: leaflet-clip-minutemen
    stampedBy:
    - stampedName: stamp-faction-clip
