# Настенные флаги

- type: entity
  parent: BaseFlag
  id: FactionFlagPGF
  name: flag of the Gezenan Federation
  suffix: CrookLv, Decor, Gezena
  description: The green banner of the Gezenan Federation, proudly hung on the wall.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionFlags/wall_flags.rsi
    state: pgf
    snapCardinals: false

- type: entity
  parent: BaseFlag
  id: FactionFlagNGR
  name: flag of the Gorlex Republic
  suffix: CrookLv, Decor, Gorlex Republic
  description: The red banner of the Gorlex Republic. Smells faintly of gunpowder.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionFlags/wall_flags.rsi
    state: ngr
    snapCardinals: false

- type: entity
  parent: BaseFlag
  id: FactionFlagSUNS
  name: flag of the Student-Union of Naturalistic Sciences
  suffix: CrookLv, Decor, SUNS
  description: The purple and gold banner of the Student-Union of Naturalistic Sciences.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionFlags/wall_flags.rsi
    state: suns

