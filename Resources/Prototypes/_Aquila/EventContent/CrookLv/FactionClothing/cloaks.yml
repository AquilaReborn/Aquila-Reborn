# Gezena
- type: entity
  parent: [ ClothingNeckBase, BaseFoldable ]
  id: ClothingNeckGezenaCape
  name: Gezena rank-cape
  suffix: CrookLv, Clothing, Gezena
  description: A flowing black drape issued to every member of the Gezenan armed forces. It can be worn on the shoulders or fully unfolded.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionCloaks/Gezena/cape.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-folded
      map: [ "foldedLayer" ]
      visible: false
  - type: Clothing
    sprite: _Aquila/EventContent/CrookLv/FactionCloaks/Gezena/cape.rsi
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: folded

