- type: entity
  parent: [ ClothingBeltBase, ClothingSlotBase ]
  id: ClothingBeltSUNSSheath
  name: sabre sheath
  suffix: CrookLv, Clothing, SUNS
  description: A leather sheath designed to hold a blade.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionBelts/SUNS/suns_sheath.rsi
  - type: Clothing
    sprite: _Aquila/EventContent/CrookLv/FactionBelts/SUNS/suns_sheath.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: Sabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - SUNSSabre
  - type: ItemMapper
    mapLayers:
      filled:
        whitelist:
          tags:
          - SUNSSabre
  - type: Appearance

