  name: cutlass scabbard
  suffix: CrookLv, Clothing, Gezena
  description: A mass produced thermoplastic-leather scabbard made to hold a boarding cutlass.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionBelts/Gezena/pgf_scabbard.rsi
