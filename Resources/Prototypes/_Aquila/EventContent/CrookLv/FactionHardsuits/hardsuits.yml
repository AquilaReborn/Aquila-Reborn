  id: ClothingOuterHardsuitCLIPPatrol
  name: LFC patrol hardsuit
  suffix: CrookLv, Clothing, LFC
  description: Standard-issue hardsuit of the LFC (League of Free Colonies) militia patrol squads. Reliable armor and decent mobility for long shifts on the frontier.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionHardsuits/CLIP/Patrol.rsi
