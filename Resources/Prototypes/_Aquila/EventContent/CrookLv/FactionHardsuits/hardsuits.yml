    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.75
        Radiation: 0.7
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: StaminaResistance
    damageCoefficient: 0.55
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitCLIPPatrol
  - type: StaticPrice
    price: 3000
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon

