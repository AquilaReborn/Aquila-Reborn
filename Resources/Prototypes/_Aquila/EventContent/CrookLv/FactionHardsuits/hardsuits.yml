# LFC
- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseMajorContraband ]
  id: ClothingOuterHardsuitCLIPPatrol
  name: patrol hardsuit
  suffix: CrookLv, Clothing, LFC
  description: A rugged hardsuit built for long frontier patrols, with reliable armor and decent mobility.
  components:
  - type: Sprite
    sprite: _Aquila/EventContent/CrookLv/FactionHardsuits/CLIP/Patrol.rsi
  - type: Clothing
    sprite: _Aquila/EventContent/CrookLv/FactionHardsuits/CLIP/Patrol.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: StaminaResistance
    damageCoefficient: 0.55
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitCLIPPatrol
  - type: StaticPrice
    price: 3000
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon

