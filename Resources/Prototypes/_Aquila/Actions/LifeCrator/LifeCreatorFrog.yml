    icon: { sprite: _Aquila/Action/guardian.rsi, state: action_live }
  - type: InstantAction
    event: !type:VivifyItemActionEvent
      creaturePrototype: LifeCreatorFrog

- type: entity
  parent: MobFrog
  id: LifeCreatorFrog
  categories: [ HideSpawnMenu ]
  components:
  - type: ReflectMeleeDamage
  - type: Item