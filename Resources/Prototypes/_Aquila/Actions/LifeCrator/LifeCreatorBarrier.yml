- type: entity
  id: ActionSpawnBarrier
  name: Create a walls
  description: Creates a wall segment at the click location. Middle mouse button — changes orientation (horizontal/vertical).
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: _Aquila/Action/guardian.rsi, state: action_wall }
    useDelay: 3
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:BarrierSpawnActionEvent
      spawnedEntityPrototype: WallBarrierSegment
  - type: BarrierOrientation

- type: entity
  id: WallBarrierSegment
  parent: DesertCactus
  name: cactus
  description: A prickly desert plant. Better not to touch it.
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 8
  - type: Barrier
    barrierLength: 3
    stepDistance: 1
    spawnDelayPerStep: 0.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]