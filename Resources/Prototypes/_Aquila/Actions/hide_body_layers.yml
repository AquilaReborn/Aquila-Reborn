- type: entity
  parent: BaseAction
  id: ActionToggleHideLayersSuit
  name: Hide or show tail and wings
  description: Toggle whether your tail and wings are visible.
  components:
  - type: Action
    icon: { sprite: Mobs/Customization/reptilian_parts.rsi, state: tail_smooth }
    itemIconStyle: BigItem
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleHideLayersEvent

- type: entity
  parent: ActionToggleHideLayersSuit
  id: ActionToggleHideLayersHelmet
  name: Hide or show ears and horns
  description: Toggle whether your ears and horns are visible.
  components:
  - type: Action
    icon: { sprite: Mobs/Customization/cat_parts.rsi, state: ears_cat_outer }
    itemIconStyle: BigItem
    useDelay: 1

- type: entity
  parent: ActionToggleHideLayersSuit
  id: ActionToggleHideLayersHair
  name: Hide or show hair
  description: Toggle whether your hair is visible.
  components:
  - type: Action
    icon: { sprite: Mobs/Customization/human_hair.rsi, state: afro }
    itemIconStyle: BigItem
    useDelay: 1
