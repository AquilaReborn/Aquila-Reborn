- type: entity
  parent: BaseAction
  id: ActionToggleHideLayersSuit
  name: Hide tail and wings
  description: Tuck your tail and wings under the suit, or let them out.
  components:
  - type: Action
    icon: { sprite: Mobs/Customization/reptilian_parts.rsi, state: tail_smooth }
    itemIconStyle: BigItem
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleHideLayersEvent

- type: entity
  parent: ActionToggleHideLayersSuit
  id: ActionToggleHideLayersHelmet
  name: Hide ears and horns
  description: Tuck your ears and horns under the helmet, or let them out.
  components:
  - type: Action
    icon: { sprite: Mobs/Customization/cat_parts.rsi, state: ears_cat_outer }
    itemIconStyle: BigItem
    useDelay: 1
