- type: entity
  id: ActionSpinSummon
  name: Bind the spin to yourself
  description: Binds Spin to you, allowing you to summon him from anywhere!
  components:
  - type: Action
    icon: { sprite: _Aquila/Action/spin.rsi, state: Action_bind }
    itemIconStyle: BigItem
    useDelay: 5
  - type: InstantAction
    event: !type:SpinSummonEvent

- type: entity
  id: ActionSpinEmpower
  name: Spin charge
  description: Charges your spin with energy. Once charged, it becomes significantly more powerful for three seconds!
  components:
  - type: Action
    icon: { sprite: _Aquila/Action/spin.rsi, state: Action_goldspin }
    itemIconStyle: BigItem
    useDelay: 15
  - type: InstantAction
    event: !type:SpinEmpowerEvent

- type: entity
  id: ActionSpinMarking
  name: Spin mark
  description: Charges your spin with energy. Once charged, it becomes significantly more powerful for three seconds!
  components:
  - type: Action
    icon: { sprite: _Aquila/Action/spin.rsi, state: Action_echo }
    itemIconStyle: BigItem
    useDelay: 15
  - type: InstantAction
    event: !type:SpinMarkingEvent

- type: entity
  id: ActionSpinStunBlow
  name: Spin stun
  description: Charges up your spin; for the next 5 seconds, your spin attacks will stun!
  components:
  - type: Action
    icon: { sprite: _Aquila/Action/spin.rsi, state: Action_stun }
    itemIconStyle: BigItem
    useDelay: 15
  - type: InstantAction
    event: !type:SpinStunBlowEvent