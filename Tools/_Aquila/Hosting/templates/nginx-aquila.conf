# Статус игрового сервера: лаунчер и хаб ходят сюда по HTTPS (ss14s://@DOMAIN@).
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location / {
        proxy_pass http://127.0.0.1:1212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# CDN с билдами: отсюда watchdog берёт сервер, а лаунчер игроков качает клиент.
server {
    listen 80;
    listen [::]:80;
    server_name @CDN_DOMAIN@;

    client_max_body_size 512m;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:27690;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
