Serilog:
  Using: [ "Serilog.Sinks.Console" ]
  MinimumLevel:
    Default: Information
    Override:
      SS14: Debug
      Microsoft: Warning
      Microsoft.Hosting.Lifetime: Information
      Microsoft.AspNetCore: Warning
  WriteTo:
    - Name: Console
      Args:
        OutputTemplate: "[{Timestamp:HH:mm:ss} {Level:u3} {SourceContext}] {Message:lj}{NewLine}{Exception}"
  Enrich: [ "FromLogContext" ]

AllowedHosts: "*"

# API watchdog доступен только с самой машины: им пользуются игровой сервер и CDN.
BaseUrl: "http://localhost:5000/"
Urls: "http://localhost:5000"

Process:
  PersistServers: true

Servers:
  Instances:
    aquila:
      Name: "Aquila"
      ApiToken: "@WATCHDOG_TOKEN@"
      ApiPort: 1212
      TimeoutSeconds: 120
      UpdateType: "Manifest"
      Updates:
        ManifestUrl: "https://@CDN_DOMAIN@/fork/aquila/manifest"
