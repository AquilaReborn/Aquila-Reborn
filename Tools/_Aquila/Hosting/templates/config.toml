# Конфиг игрового сервера Aquila. Лежит в /opt/ss14/watchdog/instances/aquila/config.toml.
# Watchdog сам передаёт серверу watchdog.* и build.*, их здесь задавать не нужно.

[config]
presets = "Corvax/common,_Aquila/main"

[net]
port = 1212

[status]
# HTTP-статус слушает только локально, наружу его отдаёт nginx по HTTPS.
bind = "127.0.0.1:1212"
connectaddress = "udp://@DOMAIN@:1212"

[hub]
server_url = "ss14s://@DOMAIN@"

[database]
engine = "postgres"
pg_host = "127.0.0.1"
pg_port = 5432
pg_database = "ss14"
pg_username = "ss14"
pg_password = "@DB_PASSWORD@"

[log]
enabled = true
path = "logs"
format = "log_%(date)s-%(time)s.txt"
level = 2

[console]
# Права хоста выдаются через базу, вход с localhost не нужен.
loginlocal = false
